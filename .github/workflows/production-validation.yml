name: PR-04 Lock Acquisition (no release)

on:
  push:
    branches: [ci/pr04-lock-acquisition]

permissions:
  contents: read

jobs:
  acquire:
    name: Acquire / ${{ matrix.lock }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10', lock: linux-3.10}
    env:
      LOCK_MATRIX: ${{ matrix.lock }}

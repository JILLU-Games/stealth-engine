.3","pip":"26.3","pip-api":"0.0.35","pip-audit":"2.10.1","pip-requirements-parser":"32.0.1","platformdirs":"4.14.5","playwright":"1.62.0","pluggy":"1.7.0","propcache":"0.5.4","py-serializable":"2.2.0","pycparser":"3.12","pydantic":"2.14.4","pydantic-core":"2.50.5","pyee":"13.0.1","pygments":"2.21.0","pyparsing":"3.3.3","pyproject-hooks":"1.3.3","pysocks":"1.7.1","pytest":"9.2.0","pywin32-ctypes":"0.2.3","pyyaml":"6.0.4","readchar":"4.2.2","readme-renderer":"46.0","requests":"2.34.2","requests-toolbelt":"1.0.0","rfc3986":"2.0.0","rich":"15.0.0","rich-click":"1.9.9","runs":"1.3.0","screeninfo":"0.8.1","secretstorage":"3.5.0","setuptools":"84.2.1","sortedcontainers":"2.4.0","tomli":"2.5.0","tomli-w":"1.2.0","twine":"7.0.0","typing-extensions":"4.16.0","typing-inspection":"0.4.5","tzdata":"2026.6","tzlocal":"5.4.5","ua-parser":"1.0.2","ua-parser-builtins":"202610","urllib3":"2.8.0","wcwidth":"0.9.5","wheel":"0.48.0","win32-setctime":"1.2.1","xmod":"1.10.0","yarl":"1.25.1","zstandard":"0.25.0"}}
          PINS
          cat > acquire.py <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, urllib.parse
          from pathlib import Path
          
          matrix = os.environ["LOCK_MATRIX"]
          pins = json.loads(Path("constraints.json").read_text(encoding="utf-8"))[matrix]
          out = Path("lock-evidence")
          out.mkdir()
          constraints = out / "constraints.txt"
          constraints.write_text("".join(f"{name}=={version}\n" for name,version in sorted(pins.items())), encoding="utf-8")
          report = out / "resolution.json"
          roots = ["camoufox[geoip]", "playwright", "browserforge", "pydantic", "aiohttp", "loguru", "tzlocal>=5.0", "pyyaml>=6.0", "pytest", "pip", "setuptools", "wheel", "build"]
          pip = [sys.executable, "-m", "pip", "--isolated", "--disable-pip-version-check"]
          subprocess.run(pip + ["install", "--dry-run", "--ignore-installed", "--only-binary=:all:", "--no-cache-dir", "--index-url", "https://pypi.org/simple", "--report", str(report), "-c", str(constraints)] + roots, check=True)
          items = json.loads(report.read_text(encoding="utf-8"))["install"]
          normalize = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          rows = {}
          wheels = {}
          for item in items:
              name = normalize(item["metadata"]["name"])
              version = item["metadata"]["version"]
              info = item["download_info"]
              parsed = urllib.parse.urlparse(info["url"])
              filename = pathlib.PurePosixPath(urllib.parse.unquote(parsed.path)).name
              digest = info.get("archive_info", {}).get("hashes", {}).get("sha256", "")
              if pins.get(name) != version:
                  raise RuntimeError(f"Unapproved resolution: {name}=={version}; expected {pins.get(name)}")
              if parsed.scheme != "https" or parsed.hostname != "files.pythonhosted.org" or not filename.endswith(".whl") or not re.fullmatch(r"[a-f0-9]{64}", digest):
                  raise RuntimeError(f"Invalid official wheel evidence: {name}")
              if name in rows or filename in wheels:
                  raise RuntimeError(f"Duplicate resolution: {name}")
              rows[name] = f"{name}=={version} --hash=sha256:{digest}"
              wheels[filename] = digest
          lock = out / f"ci-{matrix}.lock"
          lock.write_text("# Native GitHub Actions resolver; official PyPI wheels only.\n" + "\n".join(rows[n] for n in sorted(rows)) + "\n", encoding="utf-8")
          download = out / "wheelhouse"
          subprocess.run(pip + ["download", "--no-deps", "--only-binary=:all:", "--no-cache-dir", "--index-url", "https://pypi.org/simple", "--require-hashes", "-r", str(lock), "--dest", str(download)], check=True)
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in download.iterdir() if p.is_file()}
          if actual != wheels:
              raise RuntimeError("Downloaded wheel set or digest mismatch")
          for name in sorted(rows):
              print("LOCK_ENTRY " + rows[name], flush=True)
          print(f"LOCK_VERIFIED {matrix} {len(rows)} {hashlib.sha256(lock.read_bytes()).hexdigest()}", flush=True)
          (out / "wheel-sha256.json").write_text(json.dumps(actual, indent=2, sort_keys=True), encoding="utf-8")
          PY
          python acquire.py
      - name: Upload lock evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr04-lock-${{ matrix.lock }}
          path: |
            lock-evidence/*.lock
            lock-evidence/*.json
            lock-evidence/*.txt
          if-no-files-found: error
          retention-days: 14

name: Production Validation (no release)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_external_proxy:
        description: 'Run a real proxy egress smoke (requires CI_PROXY_* GitHub secrets)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: windows-2022, python: '3.12'}
    env:
      STEALTH_SMOKE: '0'
      STEALTH_CANARY: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install complete runtime/test dependencies (no stubs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "camoufox[geoip]"
          python -m pip check
          python -m pip freeze > dependency-versions.txt
      - name: Run ALL existing tests; preserve known failures
        id: full_suite
        run: python -m pytest tests -v -ra --junitxml=reports/full-suite.xml
      - name: Report results and reject unexpected skips
        if: ${{ !cancelled() && steps.full_suite.outcome != 'skipped' }}
        run: python .github/ci/junit_gate.py reports/full-suite.xml --gate regression --expected-skips ${{ runner.os == 'Windows' && '5' || '4' }}
      - name: Upload test evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/
            dependency-versions.txt
          if-no-files-found: warn
          retention-days: 14

  real_browser:
    name: Real Camoufox / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      STEALTH_SMOKE: '1'
      STEALTH_CANARY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime and real browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "camoufox[geoip]"
          python -m pip check
          python -m pip freeze > dependency-versions.txt
      - name: Install Firefox OS libraries (Linux only)
        if: runner.os == 'Linux'
        run: python -m playwright install-deps firefox
      - name: Fetch actual Camoufox binary (not a mock)
        run: python -m camoufox fetch
      - name: Run real-browser smoke + real fingerprint canaries
        id: browser_suite
        run: python -m pytest tests/test_smoke.py .github/ci/test_live_browser.py .github/ci/test_live_webgl.py -v -ra --junitxml=reports/real-browser.xml
      - name: Fail if any smoke/canary is skipped
        if: ${{ !cancelled() && steps.browser_suite.outcome != 'skipped' }}
        run: python .github/ci/junit_gate.py reports/real-browser.xml --gate browser --expected-skips 0 --min-cases 9
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: real-browser-${{ matrix.os }}
          path: |
            reports/
            dependency-versions.txt
          if-no-files-found: warn
          retention-days: 14

  direct_host:
    name: Core direct-host HTTPS/DNS/IPv4 (no proxy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install real runtime and Firefox libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "camoufox[geoip]"
          python -m pip install --no-deps aiohttp
          python -m playwright install-deps firefox
          python -m camoufox fetch
      - name: Verify actual direct browser public IPv4 and HTTPS
        id: suite
        run: python -m pytest .github/ci/test_direct_host.py -v -ra --junitxml=reports/direct-host.xml
      - name: Fail closed on missing direct-host coverage
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: python .github/ci/junit_gate.py reports/direct-host.xml --gate browser --expected-skips 0 --min-cases 1
      - name: Upload direct-host evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: core-direct-host
          path: reports/direct-host.xml
          if-no-files-found: warn
          retention-days: 14

  local_proxy:
    name: Core controlled localhost HTTP proxy + real Camoufox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install real runtime and Firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "camoufox[geoip]"
          python -m playwright install-deps firefox
          python -m camoufox fetch
      - name: Verify local proxy authentication, rejection and real browser routing
        id: suite
        run: python -m pytest .github/ci/test_local_http_proxy.py -v -ra --junitxml=reports/local-proxy.xml
      - name: Fail closed on missing proxy simulation coverage
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: python .github/ci/junit_gate.py reports/local-proxy.xml --gate browser --expected-skips 0 --min-cases 2
      - name: Upload synthetic-proxy evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: core-local-proxy
          path: reports/local-proxy.xml
          if-no-files-found: warn
          retention-days: 14

  platform_security:
    name: Core private-file ACL / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and verify filesystem permissions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Inspect real OS permissions (Windows icacls / POSIX modes)
        id: suite
        run: python -m pytest .github/ci/test_private_paths.py -v -ra --junitxml=reports/private-paths.xml
      - name: Fail closed if platform permissions are not verified
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: python .github/ci/junit_gate.py reports/private-paths.xml --gate browser --expected-skips 0 --min-cases 1
      - name: Upload filesystem acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: core-acl-${{ matrix.os }}
          path: reports/private-paths.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Clean wheel and sdist / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and validate artifacts; install wheel in fresh venv
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python .github/ci/package_gate.py
      - name: Upload distribution evidence (NOT a release)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  dependency_audit:
    name: Dependency vulnerability audit / Ubuntu Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and security auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "camoufox[geoip]" pip-audit
          python -m pip check
          python -m compileall -q stealth_engine tests .github/ci
      - name: Audit installed Python dependencies, fail on known vulnerabilities
        run: |
          mkdir -p reports
          python -m pip_audit --format json --output reports/dependency-audit.json
      - name: Upload audit evidence even if vulnerabilities are found
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: security-dependency-audit
          path: reports/dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  logging_security:
    name: F-19 nested log-secret contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify nested log sanitization (existing known blocker)
        run: python .github/ci/logging_security_gate.py

  external_proxy:
    name: Real external proxy egress (manual and secret-gated)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_proxy == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_PROXY_SERVER: ${{ secrets.CI_PROXY_SERVER }}
      CI_PROXY_USERNAME: ${{ secrets.CI_PROXY_USERNAME }}
      CI_PROXY_PASSWORD: ${{ secrets.CI_PROXY_PASSWORD }}
      CI_EGRESS_JSON_URL: ${{ secrets.CI_EGRESS_JSON_URL }}
      CI_EXPECTED_EXIT_IP: ${{ secrets.CI_EXPECTED_EXIT_IP }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime and fetch real browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "camoufox[geoip]"
          python -m playwright install-deps firefox
          python -m camoufox fetch
      - name: Verify authorized proxy exit-IP through real browser
        run: python .github/ci/external_proxy_gate.py
      # No raw browser trace uploads here: traces may contain private credentials.

  release_gate:
    name: Aggregate CI verdict (NO automatic release)
    if: ${{ always() }}
    needs: [regression, real_browser, direct_host, local_proxy, platform_security, package, logging_security, dependency_audit, external_proxy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report separate Core and External Proxy production gates
        env:
          REGRESSION: ${{ needs.regression.result }}
          BROWSER: ${{ needs.real_browser.result }}
          DIRECT_HOST: ${{ needs.direct_host.result }}
          LOCAL_PROXY: ${{ needs.local_proxy.result }}
          FILE_SECURITY: ${{ needs.platform_security.result }}
          PACKAGE: ${{ needs.package.result }}
          LOGGING_SECURITY: ${{ needs.logging_security.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency_audit.result }}
          PROXY: ${{ needs.external_proxy.result }}
        run: python .github/ci/release_gate.py
